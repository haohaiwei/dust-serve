[package]
name = "dust-serve"
version = "0.1.0"
edition = "2021"
description = "Web frontend and scan management API for dust + ClickHouse"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
bcrypt = "0.16"
once_cell = "1"
chrono = "0.4"
anyhow = "1"
toml = "0.8"
urlencoding = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
